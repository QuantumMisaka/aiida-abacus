default_inputs:
  band_settings:
    run_bands: false
    run_dos: true
    dos_postprocess_backend: pyatb
    dos_postprocess_placement: cpu-first
    symprec: 1e-5

default_protocol: balanced
protocols:
    balanced:
        description: 'Protocol to perform a PDOS-style calculation via the DOS bridge at moderate computational cost.'
    stringent:
        description: 'Protocol to perform a PDOS-style calculation via the DOS bridge at higher precision and cost.'
    fast:
        description: 'Protocol to perform a PDOS-style calculation via the DOS bridge for testing purposes.'
