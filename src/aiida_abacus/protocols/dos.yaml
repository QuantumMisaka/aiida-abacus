default_inputs:
  band_settings:
    run_bands: false
    run_dos: true
    symprec: 1e-5

default_protocol: balanced
protocols:
    balanced:
        description: 'Protocol to perform a DOS calculation at moderate computational cost.'
    stringent:
        description: 'Protocol to perform a DOS calculation at higher precision and computational cost.'
    fast:
        description: 'Protocol to perform a DOS calculation with minimal cost for testing purposes.'
